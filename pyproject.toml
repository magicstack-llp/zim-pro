[project]
name = "zim-pro"
version = "0.4.0"
description = "Offline AI knowledge base: read, search and ask your ZIM library (Wikipedia and the Kiwix catalog) with a local or hosted model, and serve it to LLM apps over MCP."
readme = "README.md"
authors = [
    { name = "Kuldip Satpute", email = "satputekuldip@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["zim", "kiwix", "offline", "wikipedia", "mcp", "rag", "knowledge-base"]
dependencies = [
    "fastapi>=0.143.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "libzim>=3.13.1",
    "markdownify>=1.2.3",
    "mcp>=2.3.0",
    "mobi>=0.4.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "selectolax>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/magicstack-llp/zim-pro"
Repository = "https://github.com/magicstack-llp/zim-pro"
Changelog = "https://github.com/magicstack-llp/zim-pro/blob/master/CHANGELOG.md"
Issues = "https://github.com/magicstack-llp/zim-pro/issues"

[project.scripts]
zim-pro = "zim_pro:main"
kiwix-updater = "zim_pro:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
