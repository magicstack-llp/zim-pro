name: Release

# Pushing a version tag (v1.2.3) lints and tests the code, publishes the Docker image to GHCR and
# attaches the Python package to a GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app into the package
        run: |
          npm ci
          npm run build
          cp -r dist ../src/zim_pro/web
        working-directory: web
      - name: Take the version from the tag
        run: uv version "${GITHUB_REF_NAME#v}"
      - run: uv build
      - name: Check the wheel starts
        run: uvx --from dist/*.whl zim-pro --help
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { on = ($2 == "[" v "]") ; next } on && !/^\[[^]]+\]: /' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
