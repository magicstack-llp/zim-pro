# Zim Pro: everything
#
# The VPN, the captcha solver, browser capture and Redis together. See compose.vpn.yml and
# compose.zimit.yml for what each part is, and what the Docker socket means.
#
# Then, in Settings -> Network:
#   Proxy address           http://gluetun:8888
#   Control server address  http://gluetun:8000
#   Control server API key  the VPN_CONTROL_KEY from .env
#   Solver address          http://gluetun:8191
#
# Values come from .env beside this file (see .env.example). Start with:
#   docker compose -f compose.full.yml up -d

services:
  zim-pro:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/magicstack-llp/zim-pro:${ZIM_PRO_TAG:-latest}
    container_name: zim-pro
    restart: unless-stopped
    healthcheck:
      # The server answers and its database can be read. The first start scans the whole
      # library before it answers, hence the long start_period.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8083}:8080"
    extra_hosts:
      # Lets Ask AI reach a model server on this machine (Ollama, LM Studio, llama.cpp)
      # at http://host.docker.internal:<port>/v1
      - "host.docker.internal:host-gateway"
    environment:
      KIWIX_ADMIN_TOKEN: ${ADMIN_TOKEN:-} # empty: no token asked for
      KIWIX_REDIS_URL: redis://redis:6379/0 # the queues and a copy of the logs
    volumes:
      - ${ZIM_DIR:-./zims}:/data # your folder of .zim files
      - ${STATE_DIR:-./state}:/state # the database, uploads and pictures
      # Browser capture (Zimit). This gives the container control of Docker on this machine.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}" # the docker group's gid: getent group docker
    depends_on:
      gluetun:
        condition: service_started
      redis:
        condition: service_healthy

  # The queues of downloads, builds and feed syncs, and a stream of the logs. Zim Pro keeps
  # its own record of every job, so this can be emptied or left out without losing any.
  redis:
    image: redis:7-alpine
    container_name: zim-pro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - redis-data:/data

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    healthcheck:
      # Gluetun's own check: the VPN tunnel is up and reaches the internet.
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      retries: 3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      - UPDATER_PERIOD=${UPDATER_PERIOD}
      - VPN_CONTROL_KEY=${VPN_CONTROL_KEY}
      - HTTPPROXY=${HTTPPROXY}
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE=${HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE}

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      retries: 3
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      LOG_LEVEL: info
      TZ: ${TZ:-Etc/UTC}

volumes:
  redis-data:
