# Zim Pro with Redis
#
# Redis holds the queues of downloads, builds and feed syncs (sorted sets named
# zimpro:queue:<name>, which you can watch and reorder with redis-cli) and a stream of the
# logs (zimpro:logs). Zim Pro keeps its own record of every job in its database: if Redis
# stops, the queues carry on from there, and Redis is filled again when it is back.
# Settings -> Queues shows what Redis holds; Settings -> Monitoring checks it.
#
# Values come from .env beside this file (see .env.example). Start with:
#   docker compose -f compose.redis.yml up -d

services:
  zim-pro:
    image: ghcr.io/magicstack-llp/zim-pro:${ZIM_PRO_TAG:-latest}
    container_name: zim-pro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8083}:8080"
    environment:
      KIWIX_ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # empty: no token asked for
      KIWIX_REDIS_URL: redis://redis:6379/0
    volumes:
      - ${ZIM_DIR:-./zims}:/data            # your folder of .zim files
      - ${STATE_DIR:-./state}:/state        # the database, uploads, pictures and log files
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: zim-pro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - redis-data:/data

volumes:
  redis-data:
